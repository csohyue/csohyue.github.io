<section class="publications">
  <h2>Publications</h2>
  
  <div class="pub-list">
    {% for pub in page.publications.contents %}
    <div class="pub-item" style="margin-bottom: 1.5rem;">
      <span class="pub-year" style="font-weight: bold; color: #666;">
        {{ pub.year }}
      </span>
      
      <div class="pub-details">
        <strong class="pub-title" style="font-size: 1.1rem;">
          {{ pub.title }}
        </strong>
        <p class="pub-authors" style="margin: 0.2rem 0;">
          {{ pub.authors }}
        </p>
        <p class="pub-venue" style="font-style: italic; margin: 0;">
          {{ pub.journal }} 
          {% if pub.status %} — <span class="pub-status">{{ pub.status }}</span>{% endif %}
        </p>
        
        {% if pub.url %}
        <a href="{{ pub.url }}" target="_blank" class="pub-link" style="color: #004488; text-decoration: none; font-size: 0.9rem;">
          [PDF / Link]
        </a>
        {% endif %}
      </div>
    </div>
    <hr style="border: 0; border-top: 1px solid #eee;">
    {% endfor %}
  </div>
</section>
